<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>BeatNest</title>

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BeatNest">

<link rel="stylesheet" href="style.css">

<!-- Vercel Analytics -->
<script>
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
</script>
<script defer src="/_vercel/insights/script.js"></script>

</head>
<body>
<main id="ob" class="ob"></main>
<div id="app" hidden>
<header class="glass top"><img class="hl" src="icon.svg" alt="BeatNest"><input id="q" type="search" placeholder="What do you want to listen to?"><button id="me" class="ic"></button></header>
<div class="main">
<section id="view"></section>
<footer class="legal-footer" aria-label="Legal and YouTube information">
  <div class="legal-links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
    <a href="data-deletion.html">Data Deletion</a>
    <a href="contact.html">Contact</a>
  </div>
  <a class="youtube-brand" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube website">
    <span class="youtube-mark" aria-hidden="true">▶</span><span><b>YouTube</b><small>Video playback powered by YouTube</small></span>
  </a>
  <p class="legal-note">BeatNest is an independent music-discovery project and is not affiliated with or endorsed by YouTube or Google.</p>
</footer>
</div>
<div id="mini" class="glass mini" hidden><img id="mi" alt=""><div><b id="mt"></b><small id="ma"></small></div><button id="mv" class="ic">⏮</button><button id="mp" class="ic pri">▶</button><button id="mx" class="ic">⏭</button></div>
<nav class="glass tabs"><div class="logo"><img src="icon.svg" alt="">BeatNest</div><button data-v="home" class="on">Home</button><button data-v="search">Search</button><button data-v="mood">Mood</button><button data-v="lib">Your Library</button></nav>
</div>
<div id="np" class="np glass"><button id="cl" class="ic">⌄</button><div id="vid" class="vid"></div><h2 id="nt">Nothing playing</h2><p id="na"></p><input id="sk" type="range" max="1000" value="0"><small id="tm">0:00 / 0:00</small>
<div class="ctl"><button id="sh" title="Shuffle">⇄</button><button id="pv">⏮</button><button id="pp" class="pri">▶</button><button id="nx">⏭</button><button id="rp" title="Repeat">↻</button></div>
<div class="ctl2"><button id="sl">⏾ Sleep timer: Off</button><a id="yl" target="_blank" rel="noopener">Open on YouTube</a></div></div>
<div id="ts" class="glass ts"></div>
<script src="https://www.youtube.com/iframe_api"></script><script src="app.js"></script></body></html>
