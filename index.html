<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000"><title>BeatNest</title>
<link rel="stylesheet" href="style.css"></head><body>
<header class="glass"><h1>BeatNest</h1><input id="q" type="search" placeholder="Search songs or artists"></header>
<nav id="langs"></nav>
<main><div id="moods"></div><h2 id="title">New releases</h2><div id="list"></div><button id="more" hidden>Show more</button></main>
<footer class="glass"><div id="yt"></div>
<div class="np"><b id="npt">Pick a song</b><small id="npa"></small></div>
<div class="ctl"><button id="sh">🔀</button><button id="pv">⏮</button><button id="pp">▶</button><button id="nx">⏭</button><button id="rp">🔁</button><button id="sl">😴</button></div></footer>
<div id="ob"><div class="glass card"><h2>Welcome to BeatNest</h2><input id="nm" placeholder="Your name"><p>Pick your languages</p><div id="ol"></div><button id="go">Start listening</button></div></div>
<script src="app.js"></script></body></html>
