<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070a"><title>Glassify</title><link rel="stylesheet" href="style.css"></head><body>
<div class="bg"><i></i><i></i><i></i></div>
<main id="ob" class="ob"></main>
<div id="app" hidden>
<header class="glass top"><b>Glassify</b><input id="q" type="search" placeholder="Search songs, artists, albums"><button id="me" class="ic"></button></header>
<section id="view"></section>
<div id="mini" class="glass mini" hidden><img id="mi"><div><b id="mt"></b><small id="ma"></small></div><button id="mp" class="ic">▶</button></div>
<nav class="glass tabs"><button data-v="home" class="on">Home</button><button data-v="search">Search</button><button data-v="lib">Library</button><button data-v="albums">Albums</button><button data-v="artists">Artists</button></nav>
</div>
<div id="np" class="np glass"><button id="cl" class="ic">⌄</button><div class="vid"><div id="yt"></div></div><h2 id="nt">Nothing playing</h2><p id="na"></p><input id="sk" type="range" max="1000" value="0"><small id="tm">0:00 / 0:00</small><div class="ctl"><button id="sh">⇄</button><button id="pv">⏮</button><button id="pp" class="pri">▶</button><button id="nx">⏭</button><button id="rp">↻</button></div><input id="vo" type="range" value="80"></div>
<div id="ts" class="glass ts"></div>
<script src="https://www.youtube.com/iframe_api"></script><script src="app.js"></script></body></html>
