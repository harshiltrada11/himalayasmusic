
name: Daily songs

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  go:
    runs-on: ubuntu-latest

    env:
      H: ${{ secrets.VERCEL_DEPLOY_HOOK }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch daily songs
        run: node scripts/fetch.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Save catalogue changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "daily songs" && git push)

      - name: Redeploy Vercel
        if: env.H != ''
        run: curl -fsS -X POST "$H"
```
